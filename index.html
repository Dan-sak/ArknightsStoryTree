							{id: 'hortus', title: '공상의 정원', desc: '다음 에피소드'},

                            { id: 'opreceforcer', title: '외출 계획', desc: '인포서 오퍼레이터 레코드' },
							{id: 'guidingafter', title: '체첼리아의 서우인 여정', desc: '카즈델로 간 에젤과 체첼리아', link:'https://www.arknights.kr/comic?name=%EC%B2%B4%EC%B2%BC%EB%A6%AC%EC%95%84%EC%9D%98+%EC%84%9C%EC%9A%B0%EC%9D%B8+%EC%97%AC%EC%A0%95&chapter=1'},
							]
							},
				]
            },
            {

				category: '사이드 스토리',
                title: '공상의 정원',
                subtitle: 'Hortus de Escapismo',
                factions: ['Laterano'],
                releaseDate: '2023-06-08', // CN 출시일
                thumbnail: 'thumb/hortus.jpg',

							{id: 'hortusafter', title: '주교의 일기', desc: '테라 히스토리쿠스 - 공상의 정원 후일담', link:'https://cafe.naver.com/f-e/cafes/29703924/articles/1185714?menuid=3&referrerAllArticles=false&page=20'},
							]
							},
				]
            },
            {
                id: 'masses',
				category: '사이드 스토리',
                title: '중생의 여정',
                subtitle: 'Masses´ Travels',
                factions: ['Laterano', 'Rhodes Island'],
                releaseDate: '2025-05-01',
                thumbnail: 'thumb/masses.jpg',
                paths: [
					{
						id: 'massesA',
                        nodes: [
                            { id: 'guiding', title: '가이딩 어헤드', desc: '라테라노 팩션 1편' },
                            { id: 'hortus', title: '공상의 정원', desc: '라테라노 팩션 2편' },
                            { id: 'masses', title: '중생의 여정', desc: '라테라노 팩션 현재 에피소드' },
							{id: 'massesafter', title: '〈성도행기〉 기록', desc: '테라 히스토리쿠스 - 중생의 여정 후일담', link:'https://cafe.naver.com/f-e/cafes/29703924/articles/1224151?menuid=3&referrerAllArticles=false&page=6'}
							]
					},
                    {
                        id: 'massesB',
                        nodes: [
                            { id: 'episode15', title: '메인 스토리 15지역', desc: '프리스티스의 목적' },
                            { id: 'masses', title: '중생의 여정', desc: '현재 에피소드' },

							]
					},
					{
						id: 'massesC', // 중복되지 않는 경로 ID
							nodes: [
								{ id: 'lingering', title: '링거링 에코스', desc: '비르투오사 등장 및 라이타니엔 설정' },
								{ id: 'zwilling', title: '츠빌링슈튀르메의 가을', desc: '황역이란? 재이란?' },
								{ id: 'oprecvirtuosa', title: '하늘과 흘러가는 구름', desc: '비르투오사 오퍼레이터 레코드' },
								{ id: 'masses', title: '중생의 여정', desc: '현재 에피소드' }
							]
					},
                ]
            },
            {
                id: 'episode14',
				category: '메인 스토리',
                title: 'Episode 14 자비의 등대',
                subtitle: 'Episode 14: Absolved Will Be the Seekers',
                factions: ['Rhodes Island'],
                releaseDate: '2024-05-01',
                thumbnail: 'thumb/episode14.jpg',
                paths: [
                            {
                        id: 'episode14A',
						nodes: [
                            { id: 'episode13', title: '흉조의 소용돌이', desc: '이전 에피소드'},
								{ id: 'episode14', title: 'Episode 14 자비의 등대', desc: '메인 스토리 현재 에피소드'},
								{ id: 'episode15', title: 'Episode 15 해리성 결합', desc: '다음 에피소드' },
								],
							},

						nodes: [

								{ id: 'episode14after', title: '두 개의 기록', desc: '테라 히스토리쿠스 14지역 후일담', link:'https://cafe.naver.com/f-e/cafes/29703924/articles/1176948' },
								],
							},
				]
            },
            {
                id: 'episode15',
				category: '메인 스토리',
                title: 'Episode 15 해리성 결합',
                subtitle: 'Episode 15: Dissociative Recombination',
                factions: ['Rhodes Island'],
                releaseDate: '2025-04-07',
                thumbnail: 'thumb/episode15.jpg',
                paths: [
                            {
                        id: 'episode15A',
						nodes: [
								{ id: 'episode14', title: 'Episode 14 자비의 등대', desc: ''},
								{ id: 'episode15', title: 'Episode 15 해리성 결합', desc: '메인 스토리 현재 에피소드' },
								],
							},
                            {
                        id: 'episode15B',
						nodes: [
                            { id: 'lynchpin', title: 'STAND BY HER SIDE', desc: '린치핀 ARG', link:'https://arknights.kr/lynchpin'},
                            { id: 'episode15', title: 'Episode 15 해리성 결합', desc: '현재 에피소드' },
							],
							},
				]
            },
            {
                id: 'lingering',
				category: '사이드 스토리',
                title: '링거링 에코스',
                subtitle: 'Lingering Echoes',
                factions: ['Leithanien'],
                releaseDate: '2022-06-09',
                thumbnail: 'https://via.placeholder.com/300x150?text=Episode+15',
                paths: [
				                   {
                        id: 'lingeringA',
                        nodes: [
                            { id: 'capriccio', title: '서문의 모음곡: 카프리치오', desc: '비르투오사와 크라이데의 과거', link: 'https://arknights.kr/comic?name=%EC%84%9C%EB%AC%B8%EC%9D%98%20%EB%AA%A8%EC%9D%8C%EA%B3%A1:%20%EC%B9%B4%ED%94%84%EB%A6%AC%EC%B9%98%EC%98%A4&chapter=2'},
                            { id: 'lingering', title: '링거링 에코스', desc: '라이타니엔 팩션 현재 에피소드' },
                            { id: 'oprecevenholz', title: '외로운 등불', desc: '에벤홀츠 오퍼레이터 레코드' },
                            { id: 'lingeringafter', title: '면담 감찰 기록&함선 이탈 신청서', desc: '테라 히스토리쿠스 링거링 에코스 후일담', link: 'https://arknights.kr/comic?name=%EC%84%9C%EB%AC%B8%EC%9D%98%20%EB%AA%A8%EC%9D%8C%EA%B3%A1:%20%EC%B9%B4%ED%94%84%EB%A6%AC%EC%B9%98%EC%98%A4&chapter=2'},
							{ id: 'zwilling', title: '츠빌링슈튀르메의 가을', desc: '다음 에피소드' }
							]
					},
				]
            },
            {
                id: 'zwilling',
				category: '사이드 스토리',
                title: '츠빌링슈튀르메의 가을',
                subtitle: 'Zwillingstürme im Herbst',
                factions: ['Leithanien', 'Laterano', 'Kazimierz'],
                releaseDate: '2023-11-01',
                thumbnail: 'thumb/zwilling.jpg',
                paths: [
				//  https://cafe.naver.com/f-e/cafes/29703924/articles/1137256?menuid=3&referrerAllArticles=false&page=30 츠빌링후일담 신 레오폴트 대학 강좌 안내 /
				]
            },
            {
                id: 'vigilo',
				category: '미니 스토리',
                title: '비질로',
                subtitle: 'VIGILO',
                factions: ['Rhodes Island', 'Babel'],
                releaseDate: '2021-07-13',
                thumbnail: 'thumb/vigilo.jpg',
                paths: [
				]
            },
        ]; // 데이터 전체 닫는 괄호

function App() {
            const [currentDepth, setCurrentDepth] = useState(0);
            const [selectedStory, setSelectedStory] = useState(null);
            const [activeCategory, setActiveCategory] = useState('All');
            const [activeFaction, setActiveFaction] = useState('All');
            const [isDarkMode, setIsDarkMode] = useState(false);

            const sortedData = useMemo(() => {
                return [...STORY_DATA].sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
            }, []);

            const filteredStories = useMemo(() => {
                return sortedData.filter(story => {
                    const categoryMatch = activeCategory === 'All' || story.category === activeCategory;
                    const factionMatch = activeFaction === 'All' || story.factions.includes(activeFaction);
                    return categoryMatch && factionMatch;
                });
            }, [activeCategory, activeFaction, sortedData]);

            const handleStoryClick = (storyId) => {
                const story = STORY_DATA.find(s => s.id === storyId);
                if (story) {
                    setSelectedStory(story);
                    setCurrentDepth(1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const theme = {
                bg: isDarkMode ? 'bg-[#050505]' : 'bg-[#f4f4f5]',
                headerText: isDarkMode ? 'text-white' : 'text-zinc-900',
                cardBg: isDarkMode ? 'bg-zinc-900' : 'bg-white',
                border: isDarkMode ? 'border-zinc-800' : 'border-zinc-200',
                textMain: isDarkMode ? 'text-zinc-200' : 'text-zinc-800',
                textSub: isDarkMode ? 'text-zinc-500' : 'text-zinc-400'
            };

            return (
                <div className={`min-h-screen ${theme.bg} ${isDarkMode ? 'text-zinc-400' : 'text-zinc-600'} transition-colors duration-500 p-6 md:p-16`}>
                    
                    {/* Header */}
                    <header className="max-w-[1550px] mx-auto mb-12 border-l-4 border-yellow-500 pl-6 flex justify-between items-start">
                        <div>
                            <motion.h1 className={`text-4xl md:text-6xl font-black tracking-tighter uppercase italic leading-[0.8] ${theme.headerText}`}>
                                ARKNIGHTS<br/><span className={isDarkMode ? 'text-zinc-800' : 'text-zinc-300'}>STORY TREE</span>
                            </motion.h1>
                        </div>
                        <div className="flex items-center gap-2 bg-zinc-800/10 p-1 rounded-full border border-zinc-500/20">
                            <button onClick={() => setIsDarkMode(true)} className={`px-3 py-1.5 rounded-full text-[10px] font-bold transition-all ${isDarkMode ? 'bg-yellow-500 text-black' : 'text-zinc-500'}`}>DARK</button>
                            <button onClick={() => setIsDarkMode(false)} className={`px-3 py-1.5 rounded-full text-[10px] font-bold transition-all ${!isDarkMode ? 'bg-zinc-900 text-white' : 'text-zinc-500'}`}>LIGHT</button>
                        </div>
                    </header>

                    <AnimatePresence mode="wait">
                        {currentDepth === 0 ? (
                            <motion.div key="list" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="max-w-[1550px] mx-auto">
                                {/* Filters Row */}
                                <div className={`flex flex-col gap-4 mb-12 border-b ${theme.border} pb-8`}>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <span className="text-[10px] font-mono mr-2 opacity-50 uppercase tracking-tighter">Category:</span>
                                        {['All', ...Object.keys(CATEGORIES)].map(cat => (
                                            <button key={cat} onClick={() => setActiveCategory(cat)}
                                                className={`px-4 py-1 text-[10px] font-bold uppercase tracking-widest border transition-all ${
                                                    activeCategory === cat 
                                                    ? (isDarkMode ? 'bg-zinc-100 text-black border-zinc-100' : 'bg-zinc-900 text-white border-zinc-900')
                                                    : `${theme.border} text-zinc-500 hover:border-zinc-400`
                                                }`}>{cat}</button>
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <span className="text-[10px] font-mono mr-2 opacity-50 uppercase tracking-tighter">Faction:</span>
                                        {FACTIONS.map(f => (
                                            <button key={f} onClick={() => setActiveFaction(f)}
                                                className={`px-4 py-1 text-[10px] font-bold uppercase tracking-widest border transition-all ${
                                                    activeFaction === f 
                                                    ? (isDarkMode ? 'bg-zinc-100 text-black border-zinc-100' : 'bg-zinc-900 text-white border-zinc-900')
                                                    : `${theme.border} text-zinc-500 hover:border-zinc-400`
                                                }`}>{f}</button>
                                        ))}
                                    </div>
                                </div>

                                {/* Story Grid */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-x-8 gap-y-12">
                                    {filteredStories.map(story => {
                                        const cat = CATEGORIES[story.category] || { label: 'UNKNOWN', color: 'bg-zinc-700' };
                                        return (
                                            <motion.div key={story.id} layout whileHover={{ y: -5 }} onClick={() => handleStoryClick(story.id)} className="cursor-pointer group relative">
											
                                                <div className={`${theme.cardBg} w-[300px] h-[150px] border ${theme.border} relative overflow-hidden group-hover:border-yellow-500 transition-all shadow-xl`}>
    
    {/* 1. 실제 이미지 태그 추가*/}
    <img 
        src={story.thumbnail} 
        alt={story.title} 
        className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        onError={(e) => { e.target.src = 'thumb/signallost.png'; }} 
    />

    {/* 2. 날짜 오버레이 */}
    <div className={`absolute top-0 right-0 ${isDarkMode ? 'bg-black/80 text-yellow-500' : 'bg-zinc-100 text-zinc-900'} font-mono text-[9px] px-2 py-1 z-10 border-b border-l ${theme.border}`}>
        CN_{story.releaseDate.replace(/-/g, '.')}
    </div>
    
    {/* 3. 그라데이션 (이미지 위에 글자가 잘 보이게 함) */}
    <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80" />
    
    {/* 4. 태그 오버레이 */}
    <div className="absolute bottom-2 left-2 right-2 flex flex-col gap-1.5">
        <div className={`${cat.color} text-white text-[10px] font-black px-2 py-0.5 w-fit shadow-md`}>{cat.label}</div>
        <div className="flex gap-1 overflow-hidden">
            {story.factions.map(f => (
                <span key={f} className="text-[8px] bg-zinc-800/80 backdrop-blur px-1 py-0.5 text-zinc-300 border border-zinc-700 uppercase font-bold">{f}</span>
            ))}
        </div>
    </div>
</div>

                                                <div className="mt-4 w-[300px]">
                                                    <h2 className={`text-sm font-bold ${theme.textMain} group-hover:text-yellow-500 transition-colors uppercase italic truncate`}>{story.title}</h2>
                                                    <p className={`text-[10px] ${theme.textSub} mt-1 font-mono pl-3.5 border-l-2 border-zinc-800 truncate`}>{story.subtitle}</p>
                                                </div>
                                            </motion.div>
                                        );
                                    })}
                                </div>
                            </motion.div>
                        ) : (
                            <motion.div key="detail" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="max-w-[1200px] mx-auto">
                                <button onClick={() => setCurrentDepth(0)} className={`mb-16 flex items-center gap-4 text-[10px] font-bold tracking-[0.4em] ${theme.textSub} hover:text-yellow-500 transition-all group`}>
                                    <span className={`px-2 py-1 border ${theme.border} group-hover:border-yellow-500`}>ESC</span> RETURN_TO_ARCHIVE
                                </button>

                                <div className={`border-l-8 pl-8 mb-20`}>
                                    <div className="flex items-center gap-3 mb-2">
                                        <span className={`${CATEGORIES[selectedStory.category].color} text-white text-[10px] font-black px-2 py-0.5`}>{CATEGORIES[selectedStory.category].label}</span>
                                        <p className="text-zinc-500 font-mono text-[10px] text-margin-top-[10px]">{selectedStory.releaseDate}</p>
                                    </div>
                                    <h2 className={`text-5xl font-black ${theme.headerText} uppercase italic tracking-tighter`}>{selectedStory.title}</h2>
                                    <p className={`${theme.textSub} text-sm mt-3 font-mono tracking-widest`}>{selectedStory.subtitle}</p>
                                </div>

                                <div className="space-y-24">
                                    {selectedStory.paths.map((path, idx) => (
                                        <div key={idx} className="flex flex-col md:flex-row items-center gap-6">
                                            {path.nodes.map((node, nIdx) => {
                                                const isCurrent = node.id === selectedStory.id;
                                                const isLink = !!node.link;
                                                
                                                // --- [자동 카테고리 로직] ---
                                                // STORY_DATA에서 현재 노드의 id와 일치하는 데이터를 찾습니다.
                                                const originalData = STORY_DATA.find(s => s.id === node.id);
                                                const nodeCat = originalData ? CATEGORIES[originalData.category] : null;

                                                return (
                                                    <React.Fragment key={nIdx}>
                                                        <motion.div whileHover={{ y: -5 }} onClick={() => isLink ? window.open(node.link, '_blank') : handleStoryClick(node.id)}
                                                            className={`p-6 w-[280px] border-t-2 transition-all cursor-pointer relative ${
                                                                isCurrent 
                                                                ? 'bg-zinc-100 border-yellow-500 text-black shadow-2xl' 
                                                                : isLink 
                                                                  ? `${theme.cardBg} border-blue-500/30 text-zinc-500 hover:border-blue-400` 
                                                                  : `${theme.cardBg} ${theme.border} ${theme.textMain} hover:border-zinc-400`
                                                            }`}>
                                                            <div className="flex justify-between items-start mb-2">
                                                                <div className="flex flex-col gap-1">
                                                                    <span className="text-[8px] font-mono opacity-50 uppercase tracking-tighter">{isLink ? 'Link_Archive' : `Node_0${nIdx+1}`}</span>
                                                                    {/* 데이터가 존재하고 링크가 아닐 때만 카테고리 태그 표시 */}
                                                                    {!isLink && nodeCat && (
                                                                        <span className={`${nodeCat.color} text-white text-[8px] font-black px-1.5 py-0.5 w-fit leading-none shadow-sm`}>
                                                                            {nodeCat.label}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                {isLink && <span className="text-blue-500 text-xs">🔗</span>}
                                                            </div>
                                                            <h3 className="font-bold text-md leading-tight uppercase italic truncate">{node.title}</h3>
                                                            <div className={`h-px ${isCurrent ? 'bg-black/10' : 'bg-zinc-500/10'} my-3`} />
                                                            <p className="text-[11px] leading-relaxed opacity-70 line-clamp-2">{node.desc}</p>
                                                        </motion.div>
                                                        {nIdx < path.nodes.length - 1 && (
                                                            <div className={`${isDarkMode ? 'text-zinc-800' : 'text-zinc-300'} rotate-90 md:rotate-0`}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                                                        )}
                                                    </React.Fragment>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
