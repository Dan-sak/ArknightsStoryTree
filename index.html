<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKNIGHTS STORY TREE</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto+Sans+KR', sans-serif; transition: background-color 0.3s ease; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .no-signal-bg { background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(120,120,120,0.05) 10px, rgba(120,120,120,0.05) 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const CATEGORIES = {
            '메인 스토리': { label: 'MAIN STORY', color: 'bg-red-600', text: 'text-red-600' },
            '사이드 스토리': { label: 'SIDE STORY', color: 'bg-blue-600', text: 'text-blue-600' },
            '미니 스토리': { label: 'MINI STORY', color: 'bg-emerald-600', text: 'text-emerald-600' },
            '콜라보레이션': { label: 'COLLAB', color: 'bg-purple-600', text: 'text-purple-600' }
        };

        const FACTIONS = ['All', 'Rhodes Island', 'Laterano', 'Kjerag', 'Siracusa', 'Kazimierz', 'Yan', 'Sui', 'Rhine Lab', 'Aegir', 'Leithanien', 'Victoria', 'Tara', 'Ursus', 'Sami', 'Columbia', 'Sargon', 'Rim Billiton', 'Kazdel', 'Babel'];

        function App() {
            const [storyData, setStoryData] = useState([]);
            const [currentDepth, setCurrentDepth] = useState(0);
            const [selectedStory, setSelectedStory] = useState(null);
            const [activeCategory, setActiveCategory] = useState('All');
            const [activeFaction, setActiveFaction] = useState('All');
            const [isDarkMode, setIsDarkMode] = useState(false); 
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [isFilterExpanded, setIsFilterExpanded] = useState(window.innerWidth > 768);

            useEffect(() => {
                fetch('./data.json')
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ERROR: ${res.status}`);
                        return res.text();
                    })
                    .then(text => {
                        try {
                            setStoryData(JSON.parse(text));
                            setLoading(false);
                        } catch (e) {
                            let lineMsg = "";
                            const posMatch = e.message.match(/at position (\d+)/);
                            if (posMatch) {
                                const lines = text.substring(0, parseInt(posMatch[1])).split('\n');
                                lineMsg = ` [약 ${lines.length}번째 라인 근처]`;
                            }
                            throw new Error(`JSON 문법 오류${lineMsg}: ${e.message}`);
                        }
                    })
                    .catch(err => { setError(err.message); setLoading(false); });
            }, []);

            useEffect(() => {
                const handleResize = () => { if (window.innerWidth > 768) setIsFilterExpanded(true); };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#/', '');
                    if (hash && storyData.length > 0) {
                        const story = storyData.find(s => s.id === hash);
                        if (story) { setSelectedStory(story); setCurrentDepth(1); }
                    } else { setCurrentDepth(0); setSelectedStory(null); }
                };
                window.addEventListener('hashchange', handleHashChange);
                if (!loading) handleHashChange();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [loading, storyData]);

            const filteredStories = useMemo(() => {
                return [...storyData]
                    .sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate))
                    .filter(story => {
                        const categoryMatch = activeCategory === 'All' || story.category === activeCategory;
                        const factionMatch = activeFaction === 'All' || story.factions.includes(activeFaction);
                        return categoryMatch && factionMatch;
                    });
            }, [activeCategory, activeFaction, storyData]);

            const toggleCategory = (cat) => setActiveCategory(prev => prev === cat ? 'All' : cat);
            const toggleFaction = (fac) => setActiveFaction(prev => prev === fac ? 'All' : fac);

            const theme = {
                bg: isDarkMode ? 'bg-[#050505]' : 'bg-[#f4f4f5]',
                headerText: isDarkMode ? 'text-white' : 'text-zinc-900',
                cardBg: isDarkMode ? 'bg-zinc-900' : 'bg-white',
                border: isDarkMode ? 'border-zinc-800' : 'border-zinc-200',
                textMain: isDarkMode ? 'text-zinc-200' : 'text-zinc-800',
                textSub: isDarkMode ? 'text-zinc-500' : 'text-zinc-400'
            };

            if (loading) return <div className="min-h-screen bg-white flex items-center justify-center font-mono text-zinc-400 uppercase tracking-widest animate-pulse">Accessing_Pristine_Database...</div>;
            
            if (error) return (
                <div className="min-h-screen bg-[#050505] flex flex-col items-center justify-center font-mono p-10 text-center">
                    <div className="border border-red-500/50 bg-red-500/10 p-8 max-w-2xl text-red-500">
                        <h1 className="text-2xl font-black mb-2 uppercase tracking-tighter">Sync_Failed</h1>
                        <p className="text-sm opacity-80">{error}</p>
                    </div>
                </div>
            );

            return (
                <div className={`min-h-screen ${theme.bg} ${isDarkMode ? 'text-zinc-400' : 'text-zinc-600'} transition-colors duration-500 p-6 md:p-16`}>
                    
                    <header className="max-w-[1550px] mx-auto mb-12 border-l-4 border-yellow-500 pl-6 flex justify-between items-start">
                        <motion.h1 className={`text-4xl md:text-6xl font-black tracking-tighter uppercase italic leading-[0.8] ${theme.headerText}`}>
                            ARKNIGHTS<br/><span className={isDarkMode ? 'text-zinc-800' : 'text-zinc-300'}>STORY TREE</span>
                        </motion.h1>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className={`px-3 py-1 border border-zinc-500/20 rounded-full font-mono text-[9px] font-bold ${isDarkMode ? 'bg-zinc-800 text-yellow-500' : 'bg-white text-zinc-900 shadow-sm'}`}>
                            {isDarkMode ? 'TERMINAL_DARK' : 'TERMINAL_LIGHT'}
                        </button>
                    </header>

                    <AnimatePresence mode="wait">
                        {currentDepth === 0 ? (
                            <motion.div key="list" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="max-w-[1550px] mx-auto">
                                <div className={`mb-12 border-b ${theme.border} pb-6`}>
                                    <button onClick={() => setIsFilterExpanded(!isFilterExpanded)} className="md:hidden w-full flex justify-between items-center py-2 mb-4 text-[11px] font-black tracking-[0.3em] text-zinc-500">
                                        FILTERS {isFilterExpanded ? '▲' : '▼'}
                                    </button>
                                    <motion.div initial={false} animate={{ height: isFilterExpanded ? 'auto' : 0, opacity: isFilterExpanded ? 1 : 0 }} className="overflow-hidden space-y-4">
                                        <div className="flex flex-wrap gap-2 items-center">
                                            <span className="text-[10px] font-mono mr-2 opacity-50 uppercase tracking-tighter">Category:</span>
                                            {['All', ...Object.keys(CATEGORIES)].map(cat => (
                                                <button key={cat} onClick={() => toggleCategory(cat)}
                                                    className={`px-4 py-1 text-[10px] font-bold uppercase tracking-widest border transition-all ${
                                                        activeCategory === cat 
                                                        ? (isDarkMode ? 'bg-zinc-100 text-black border-zinc-100' : 'bg-zinc-900 text-white border-zinc-900 shadow-lg')
                                                        : `${theme.border} text-zinc-500 hover:border-zinc-400`
                                                    }`}>{cat}</button>
                                            ))}
                                        </div>
                                        <div className="flex flex-wrap gap-2 items-center">
                                            <span className="text-[10px] font-mono mr-2 opacity-50 uppercase tracking-tighter">Faction:</span>
                                            {FACTIONS.map(f => (
                                                <button key={f} onClick={() => toggleFaction(f)}
                                                    className={`px-4 py-1 text-[10px] font-bold uppercase tracking-widest border transition-all ${
                                                        activeFaction === f 
                                                        ? (isDarkMode ? 'bg-zinc-100 text-black border-zinc-100' : 'bg-zinc-900 text-white border-zinc-900 shadow-lg')
                                                        : `${theme.border} text-zinc-500 hover:border-zinc-400`
                                                    }`}>{f}</button>
                                            ))}
                                        </div>
                                    </motion.div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-x-8 gap-y-12">
                                    {filteredStories.map(story => {
                                        const cat = CATEGORIES[story.category] || { label: 'UNKNOWN', color: 'bg-zinc-700' };
                                        return (
                                            <motion.div key={story.id} layout whileHover={{ y: -5 }} onClick={() => window.location.hash = `/${story.id}`} className="cursor-pointer group">
                                                <div className={`${theme.cardBg} w-[300px] h-[150px] border ${theme.border} relative overflow-hidden group-hover:border-yellow-500 transition-all shadow-md group-hover:shadow-2xl`}>
                                                    {story.thumbnail ? (
                                                        <img src={story.thumbnail} className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                                    ) : null}
                                                    <div className="absolute inset-0 hidden md:flex flex-col items-center justify-center no-signal-bg opacity-10 group-hover:opacity-30 transition-opacity">
                                                        <span className="text-[9px] font-mono tracking-[0.5em]">//NO SIGNAL//</span>
                                                    </div>
                                                    <div className={`absolute top-0 right-0 ${isDarkMode ? 'bg-black/80 text-yellow-500' : 'bg-white/90 text-zinc-900'} font-mono text-[9px] px-2 py-1 z-10 border-b border-l ${theme.border}`}>CN_{story.releaseDate.replace(/-/g, '.')}</div>
                                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent" />
                                                    <div className="absolute bottom-2 left-2 right-2 flex flex-col gap-1.5">
                                                        <div className={`${cat.color} text-white text-[10px] font-black px-2 py-0.5 w-fit shadow-md`}>{cat.label}</div>
                                                        <div className="flex gap-1">
                                                            {story.factions.map(f => (
                                                                <span key={f} className="text-[8px] bg-zinc-800/80 backdrop-blur px-1 py-0.5 text-zinc-300 border border-zinc-700 uppercase font-bold">{f}</span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="mt-4 w-[300px]">
                                                    <h2 className={`text-sm font-bold ${theme.textMain} group-hover:text-yellow-500 transition-colors uppercase italic truncate`}>{story.title}</h2>
                                                    <p className={`text-[10px] ${theme.textSub} mt-1 font-mono pl-3.5 border-l-2 border-zinc-800 truncate`}>{story.subtitle}</p>
                                                </div>
                                            </motion.div>
                                        );
                                    })}
                                </div>
                            </motion.div>
                        ) : (
                            <motion.div key="detail" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="max-w-[1200px] mx-auto">
                                <button onClick={() => window.location.hash = ''} className={`mb-16 flex items-center gap-4 text-[10px] font-bold tracking-[0.4em] ${theme.textSub} hover:text-yellow-500 transition-all group`}>
                                    <span className={`px-2 py-1 border ${theme.border} group-hover:border-yellow-500 bg-white shadow-sm`}>ESC</span> RETURN_TO_ARCHIVE
                                </button>

                                <div className={`border-l-2 ${isDarkMode ? 'border-zinc-800' : 'border-zinc-300'} pl-8 mb-20`}>
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className={`text-[10px] font-black tracking-widest ${CATEGORIES[selectedStory.category].text}`}>[{CATEGORIES[selectedStory.category].label}]</span>
                                        <div className="w-1 h-1 rounded-full bg-zinc-500" />
                                        <p className="text-zinc-500 font-mono text-[10px] tracking-tighter">{selectedStory.releaseDate}</p>
                                    </div>
                                    <h2 className={`text-5xl md:text-6xl font-black ${theme.headerText} uppercase italic tracking-tighter leading-none`}>{selectedStory.title}</h2>
                                    <p className={`${theme.textSub} text-sm mt-4 font-mono tracking-[0.2em] opacity-80 uppercase`}>{selectedStory.subtitle}</p>
                                </div>

                                <div className="space-y-16">
                                    {selectedStory.paths.map((path, idx) => (
                                        <React.Fragment key={idx}>
                                            {/* --- [1. Paths 사이 가느다란 Zinc 구분선 추가] --- */}
                                            {idx > 0 && (
                                                <div className={`w-full border-t ${isDarkMode ? 'border-zinc-800' : 'border-zinc-200'} my-4`} />
                                            )}
                                            
                                            <div className="flex flex-col md:flex-row items-center gap-4 flex-wrap">
                                                {path.nodes.map((node, nIdx) => {
                                                    const isCurrent = node.id === selectedStory.id;
                                                    const originalData = storyData.find(s => s.id === node.id);
                                                    const nodeCat = originalData ? CATEGORIES[originalData.category] : null;

                                                    return (
                                                        <React.Fragment key={nIdx}>
                                                            {/* --- [2. 다크 모드 isCurrent 카드 최적화 (확대 제거 유지)] --- */}
                                                            <motion.div whileHover={{ y: -5 }} onClick={() => node.link ? window.open(node.link, '_blank') : (window.location.hash = `/${node.id}`)}
                                                                className={`p-6 w-[280px] border-t-2 transition-all cursor-pointer relative shadow-sm ${
                                                                    isCurrent 
                                                                    ? (isDarkMode 
                                                                        ? 'bg-zinc-800 border-yellow-500 text-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.15)] z-10' 
                                                                        : 'bg-zinc-100 border-yellow-500 text-black shadow-xl z-10')
                                                                    : `${theme.cardBg} ${theme.border} ${theme.textMain} hover:border-zinc-400`
                                                                }`}>
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <div className="flex flex-col gap-1">
                                                                        <span className="text-[8px] font-mono opacity-50 uppercase tracking-tighter">{node.link ? 'Link_Archive' : `Node_0${nIdx+1}`}</span>
                                                                        {!node.link && nodeCat && (
                                                                            <span className={`${nodeCat.color} text-white text-[8px] font-black px-1.5 py-0.5 w-fit leading-none shadow-sm mt-1`}>
                                                                                {nodeCat.label}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    {node.link && <span className="text-blue-500 text-xs">🔗</span>}
                                                                </div>
                                                                <h3 className="font-bold text-md leading-tight uppercase italic truncate">{node.title}</h3>
                                                                <div className={`h-px ${isCurrent ? (isDarkMode ? 'bg-yellow-500/20' : 'bg-black/10') : 'bg-zinc-500/10'} my-3`} />
                                                                <p className="text-[11px] leading-relaxed opacity-70 line-clamp-2">{node.desc}</p>
                                                            </motion.div>
                                                            
                                                            {/* 노드 사이 연결 화살표 (기존 유지) */}
                                                            {nIdx < path.nodes.length - 1 && path.layout !== 'list' && (
                                                                <div className={`${isDarkMode ? 'text-zinc-800' : 'text-zinc-300'} rotate-90 md:rotate-0`}>
                                                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                                                </div>
                                                            )}
                                                        </React.Fragment>
                                                    );
                                                })}
                                            </div>
                                        </React.Fragment>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
